amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: odom
    progress_checker_plugin: "progress_checker"
    ProgressChecker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02 # Dropped from 0.1m to 2cm to accommodate micro-movements
      movement_time_allowance: 10.0
    GoalChecker:
      plugin: "nav2_controller::SimpleGoalChecker"
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      max_vel_x: 0.5
      min_vel_x: 0.0
      min_shining_vel_x: 0.01
      min_theta_velocity_threshold: 0.001
      max_vel_theta: 3.14
      sim_time: 1.5
      sim_granularity: 0.02
      footprint_spec: "[[-0.15, -0.1], [0.15, -0.1], [0.15, 0.1], [-0.15, 0.1]]"
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      RotateToGoal:
        scale: 32.0
      Oscillation:
        scale: 1.0
      BaseObstacle:
        scale: 0.02
      GoalAlign:
        scale: 24.0
        forward_point_distance: 0.325
      PathAlign:
        scale: 32.0
        forward_point_distance: 0.325
      PathDist:
        scale: 32.0
        aggregation_type: "last"
      GoalDist:
        scale: 24.0
        aggregation_type: "last"
      scaling_factor: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.2
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.15, -0.1], [0.15, -0.1], [0.15, 0.1], [-0.15, 0.1]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pointcloud_source
        pointcloud_source:
          topic: /cloud_points
          sensor_frame: base_link
          data_type: PointCloud2
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[-0.15, -0.1], [0.15, -0.1], [0.15, 0.1], [-0.15, 0.1]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15
        cost_scaling_factor: 5.0